# CUARTEL — archivo único. GitHub arma la app y compila el APK solo.
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Escribir proyecto
        run: |
          mkdir -p www/fonts assets
          cat > package.json <<'CUARTEL_EOF'
          {
            "name": "cuartel",
            "version": "1.0.0",
            "description": "App personal de h\u00e1bitos, alimentaci\u00f3n y entrenamiento",
            "scripts": {
              "android:add": "cap add android",
              "sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/android": "^8.6.0",
              "@capacitor/core": "^8.6.0",
              "@capacitor/local-notifications": "^8.3.1"
            },
            "devDependencies": {
              "@capacitor/assets": "^4.0.0",
              "@capacitor/cli": "^8.6.0",
              "@fontsource/black-ops-one": "^5.3.0",
              "@fontsource/inter": "^5.3.0"
            },
            "private": true
          }
          CUARTEL_EOF
          cat > capacitor.config.json <<'CUARTEL_EOF'
          {
            "appId": "cl.cobrasur.cuartel",
            "appName": "Cuartel",
            "webDir": "www",
            "android": { "backgroundColor": "#12150f" },
            "plugins": {
              "LocalNotifications": { "iconColor": "#f2b134" }
            }
          }
          CUARTEL_EOF
          cat > www/index.html <<'CUARTEL_EOF'
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
          <meta name="theme-color" content="#12150f">
          <title>Cuartel</title>
          <link rel="stylesheet" href="styles.css">
          </head>
          <body>
          <header class="topbar">
            <div class="brand"><span class="star">★</span> CUARTEL</div>
            <div class="mission-chip" id="missionChip">DÍA 1/30</div>
          </header>

          <main id="view"></main>

          <nav class="tabs" id="tabs">
            <button data-tab="cuartel" class="on"><span>🎖️</span>Cuartel</button>
            <button data-tab="plato"><span>🍽️</span>Plato</button>
            <button data-tab="entreno"><span>💪</span>Entreno</button>
            <button data-tab="progreso"><span>📈</span>Progreso</button>
          </nav>

          <div class="toast" id="toast"></div>
          <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

          <script src="foods.js"></script>
          <script src="app.js"></script>
          </body>
          </html>
          CUARTEL_EOF
          cat > www/styles.css <<'CUARTEL_EOF'
          @font-face { font-family: 'BlackOps'; src: url(fonts/blackops.woff2) format('woff2'); font-display: swap; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-400.woff2) format('woff2'); font-weight: 400; unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-ext-400.woff2) format('woff2'); font-weight: 400; unicode-range: U+0100-024F; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-600.woff2) format('woff2'); font-weight: 600; unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-ext-600.woff2) format('woff2'); font-weight: 600; unicode-range: U+0100-024F; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-800.woff2) format('woff2'); font-weight: 800; unicode-range: U+0000-00FF, U+2000-206F, U+20AC; }
          @font-face { font-family: 'Inter'; src: url(fonts/inter-ext-800.woff2) format('woff2'); font-weight: 800; unicode-range: U+0100-024F; }

          :root {
            --bg: #12150f;
            --panel: #1b2016;
            --panel2: #242b1d;
            --line: #343e28;
            --ink: #eceedd;
            --muted: #9ba48a;
            --accent: #f2b134;
            --accent-ink: #1a1405;
            --ok: #82c454;
            --bad: #e8573f;
            --veg: #5fae4b;
            --prot: #d9654a;
            --carb: #e2a93b;
            --side: #6aa3c9;
            --plate: #e9e6da;
            --plate-rim: #cfcab8;
            --radius: 16px;
            color-scheme: dark;
          }

          * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
          html, body { margin: 0; background: var(--bg); color: var(--ink); }
          body {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px; line-height: 1.4;
            min-height: 100vh;
            padding-bottom: calc(76px + env(safe-area-inset-bottom));
            overscroll-behavior-y: none;
          }
          button, input, select, textarea { font: inherit; color: inherit; }
          button { cursor: pointer; border: 0; background: none; }
          h1, h2, h3 { font-family: 'BlackOps', 'Inter', sans-serif; font-weight: 400; letter-spacing: .5px; margin: 0; }
          h2 { font-size: 18px; }
          h3 { font-size: 15px; }

          .topbar {
            position: sticky; top: 0; z-index: 20;
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
            background: rgba(18,21,15,.94); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
          }
          .brand { font-family: 'BlackOps', sans-serif; font-size: 22px; letter-spacing: 2px; }
          .brand .star { color: var(--accent); }
          .mission-chip {
            font-family: 'BlackOps', sans-serif; font-size: 13px;
            background: var(--accent); color: var(--accent-ink);
            padding: 4px 10px; border-radius: 6px;
          }

          main { padding: 14px 16px 24px; max-width: 560px; margin: 0 auto; }

          .tabs {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: grid; grid-template-columns: repeat(4, 1fr);
            background: #0e110b; border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom);
          }
          .tabs button { padding: 8px 0 10px; color: var(--muted); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
          .tabs button span { font-size: 21px; filter: grayscale(1) opacity(.6); transition: filter .2s, transform .2s; }
          .tabs button.on { color: var(--accent); }
          .tabs button.on span { filter: none; transform: translateY(-2px); }

          .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
          .card.tight { padding: 10px 12px; }
          .row { display: flex; align-items: center; gap: 10px; }
          .between { justify-content: space-between; }
          .muted { color: var(--muted); }
          .small { font-size: 12.5px; }
          .big { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
          .num { font-variant-numeric: tabular-nums; }
          .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
          .grid2 > .card { margin-bottom: 0; }
          .mt { margin-top: 10px; }
          .mb { margin-bottom: 10px; }

          /* Instructor */
          .sarge { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(135deg, #2b331f, #1b2016); border-color: #4a5634; }
          .sarge .face { font-size: 38px; line-height: 1; flex: none; animation: bob 3s ease-in-out infinite; }
          .sarge .label { font-family: 'BlackOps', sans-serif; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
          .sarge .msg { font-weight: 600; font-size: 15.5px; margin-top: 2px; }
          @keyframes bob { 50% { transform: translateY(-3px) rotate(-3deg); } }

          /* Buttons */
          .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600; transition: transform .1s; }
          .btn:active { transform: scale(.96); }
          .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
          .btn.danger { background: transparent; color: var(--bad); border-color: #6a2b20; }
          .btn.block { width: 100%; padding: 13px; font-size: 16px; }
          .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }

          /* Progress bars */
          .bar { height: 10px; background: #0d100a; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
          .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
          .bar.ok > i { background: var(--ok); }
          .bar.bad > i { background: var(--bad); }

          /* Water */
          .water { display: flex; gap: 14px; align-items: center; }
          .glass { width: 74px; height: 104px; flex: none; }
          .glass .fill { transition: y .7s cubic-bezier(.2,.8,.2,1), height .7s cubic-bezier(.2,.8,.2,1); }
          .water-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

          /* Streak */
          .streak .big { color: var(--ok); }
          .streak.zero .big { color: var(--bad); }
          .flame { font-size: 30px; }

          /* Orders */
          .order { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
          .order:last-child { border-bottom: 0; }
          .check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 800; transition: all .25s; }
          .order.done .check { background: var(--ok); border-color: var(--ok); color: #0d1a05; }
          .order.done .txt { color: var(--muted); text-decoration: line-through; }
          .order .auto { margin-left: auto; font-size: 11px; color: var(--muted); }

          /* Plate builder */
          .meal-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
          .meal-chips::-webkit-scrollbar { display: none; }
          .chip { flex: none; padding: 7px 12px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted); }
          .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
          .chip .k { opacity: .7; font-weight: 400; margin-left: 4px; }

          .table-stage { position: relative; background: radial-gradient(ellipse at 50% 45%, #3a2c1d 0%, #2a2016 60%, #1f1811 100%); border-radius: var(--radius); border: 1px solid #4a3a26; padding: 14px 10px 10px; overflow: hidden; }
          .table-stage::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 2px, transparent 2px 18px); pointer-events: none; }
          .plate-wrap { display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; }
          #plateSvg { width: 74%; max-width: 290px; height: auto; overflow: visible; }
          .sides { display: flex; flex-direction: column; gap: 8px; width: 22%; max-width: 86px; }
          .side-svg { width: 100%; height: auto; overflow: visible; }
          .zone-label { font-family: 'BlackOps', sans-serif; font-size: 11px; fill: rgba(0,0,0,.42); letter-spacing: .5px; pointer-events: none; }
          .zone-fill { transition: opacity .5s; }
          .token { font-size: 27px; pointer-events: none; }
          .token.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); transform-box: fill-box; transform-origin: center; }
          @keyframes pop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
          .flyer { position: fixed; z-index: 100; font-size: 30px; pointer-events: none; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
          .plate-shake { animation: shake .4s; }
          @keyframes shake { 20% { transform: translateX(-5px) rotate(-1deg);} 40% { transform: translateX(5px) rotate(1deg);} 60% { transform: translateX(-3px);} 80% { transform: translateX(3px);} }

          .kcal-hud { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; color: #f3e8d2; }
          .kcal-hud .big { font-size: 30px; }
          .kcal-hud .bump { animation: bump .4s; display: inline-block; }
          @keyframes bump { 40% { transform: scale(1.25); color: var(--accent); } }
          .verdict { margin-top: 8px; padding: 9px 11px; border-radius: 10px; background: rgba(0,0,0,.35); font-weight: 600; font-size: 13.5px; color: #f3e8d2; display: flex; gap: 8px; align-items: flex-start; }
          .verdict.good { background: rgba(130,196,84,.18); }
          .verdict.bad { background: rgba(232,87,63,.2); }

          .legend { display: flex; gap: 10px; justify-content: center; margin-top: 8px; font-size: 11.5px; color: #d9cdb5; flex-wrap: wrap; }
          .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

          .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
          .cat-tabs::-webkit-scrollbar { display: none; }
          .cat-tabs .chip { font-size: 12.5px; }
          .search { width: 100%; background: #0d100a; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
          .foods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
          .food { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; display: flex; gap: 8px; align-items: center; transition: transform .1s, border-color .2s; min-height: 62px; }
          .food:active { transform: scale(.95); border-color: var(--accent); }
          .food .em { font-size: 26px; flex: none; }
          .food .nm { font-weight: 600; font-size: 13px; line-height: 1.2; }
          .food .pt { font-size: 11px; color: var(--muted); line-height: 1.2; }
          .food .kc { font-size: 12px; color: var(--accent); font-weight: 700; }
          .food.warn { border-color: #5c2a20; }

          /* Nutrition table */
          .ntable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
          .ntable th { text-align: right; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
          .ntable th:first-child, .ntable td:first-child { text-align: left; }
          .ntable td { text-align: right; padding: 7px 4px; border-bottom: 1px solid #262e1e; font-variant-numeric: tabular-nums; vertical-align: middle; }
          .ntable tr.total td { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--line); color: var(--accent); }
          .ntable .it { display: flex; align-items: center; gap: 6px; }
          .ntable .it .nm { line-height: 1.15; }
          .ntable .it .pt { color: var(--muted); font-size: 11px; }
          .qty { display: inline-flex; align-items: center; gap: 4px; }
          .qty button { width: 24px; height: 24px; border-radius: 7px; background: var(--panel2); border: 1px solid var(--line); font-weight: 800; line-height: 1; }
          .ntable tr.new td { animation: rowin .5s; }
          @keyframes rowin { from { background: rgba(242,177,52,.25); } to { background: transparent; } }

          .macro { display: grid; grid-template-columns: 74px 1fr 76px; align-items: center; gap: 8px; font-size: 13px; margin-top: 7px; }
          .macro .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

          /* Training */
          .ex { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
          .ex:last-child { border-bottom: 0; }
          .ex .em { font-size: 26px; width: 36px; text-align: center; }
          .ex .nm { font-weight: 600; }
          .ex .meta { font-size: 12px; color: var(--muted); }
          .drill { text-align: center; }
          .drill .em { font-size: 64px; margin: 6px 0; animation: bob 2s ease-in-out infinite; display: inline-block; }
          .drill h2 { font-size: 22px; }
          .drill .how { color: var(--muted); margin: 8px 0 12px; font-size: 14px; text-align: left; background: var(--panel2); border-radius: 12px; padding: 10px 12px; }
          .drill .how li { margin: 3px 0; }
          .drill .sets { display: flex; justify-content: center; gap: 8px; margin: 10px 0; }
          .drill .sets i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); }
          .drill .sets i.done { background: var(--ok); border-color: var(--ok); }
          .ring { width: 170px; height: 170px; margin: 6px auto; display: block; }
          .ring .bg { stroke: var(--line); }
          .ring .fg { stroke: var(--accent); transition: stroke-dashoffset 1s linear; }
          .stepper { display: inline-flex; align-items: center; gap: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
          .stepper button { width: 38px; height: 38px; border-radius: 9px; background: var(--panel); font-size: 20px; font-weight: 800; }
          .stepper .v { min-width: 64px; text-align: center; font-weight: 800; font-size: 18px; }

          /* Progress chart */
          .chart { width: 100%; height: auto; display: block; }
          .chart text { fill: var(--muted); font-size: 10px; font-family: Inter, sans-serif; }
          .chart .grid { stroke: #262e1e; }
          .chart .goal { stroke: var(--accent); stroke-dasharray: 5 5; fill: none; stroke-width: 2; }
          .chart .line { stroke: var(--ok); fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
          .chart .dot { fill: var(--ok); stroke: var(--bg); stroke-width: 2; }
          .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
          .photos figure { margin: 0; position: relative; }
          .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
          .photos figcaption { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 2px; }

          /* Forms */
          label.f { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
          label.f input, label.f select, textarea { display: block; width: 100%; margin-top: 4px; background: #0d100a; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; }
          .toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
          .switch { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
          .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
          .switch.on { background: var(--ok); }
          .switch.on::after { transform: translateX(18px); }

          /* Toast & modal */
          .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #2b331f; border: 1px solid #4a5634; padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all .3s; z-index: 200; max-width: 88vw; text-align: center; pointer-events: none; }
          .toast.show { opacity: 1; transform: translate(-50%, 0); }
          .toast.bad { background: #3a1c16; border-color: #6a2b20; }
          .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 150; display: none; align-items: flex-end; justify-content: center; }
          .modal-bg.show { display: flex; }
          .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; animation: up .25s ease-out; }
          @keyframes up { from { transform: translateY(40px); opacity: 0; } }
          .modal h2 { margin-bottom: 10px; }
          .modal .actions { display: flex; gap: 8px; margin-top: 12px; }
          .modal .actions .btn { flex: 1; }

          .setup h1 { font-size: 26px; margin: 8px 0 4px; }
          .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); }
          .pill.ok { color: var(--ok); border-color: #3c5a26; }
          .pill.bad { color: var(--bad); border-color: #6a2b20; }
          .list-plain { margin: 6px 0 0; padding-left: 18px; }
          .list-plain li { margin: 4px 0; }
          .medlist .order .txt { font-size: 14px; }

          @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
          CUARTEL_EOF
          cat > www/foods.js <<'CUARTEL_EOF'
          // Base de alimentos. Valores aproximados por porción indicada.
          // k = kcal, pr = proteína (g), c = carbohidratos (g), g = grasa (g)
          // cat = categoría del catálogo, z = zona del plato
          window.CATS = [
            { id: 'veg',    n: 'Verduras',   e: '🥦', z: 'veg'  },
            { id: 'prot',   n: 'Proteínas',  e: '🍗', z: 'prot' },
            { id: 'carb',   n: 'Carbos',     e: '🍚', z: 'carb' },
            { id: 'fruta',  n: 'Frutas',     e: '🍎', z: 'side' },
            { id: 'lacteo', n: 'Lácteos',    e: '🥛', z: 'side' },
            { id: 'grasa',  n: 'Grasas',     e: '🥑', z: 'side' },
            { id: 'bebida', n: 'Bebidas',    e: '🥤', z: 'drink'},
            { id: 'plato',  n: 'Platos chilenos', e: '🇨🇱', z: 'mixed' },
            { id: 'mios',   n: 'Mis alimentos', e: '⭐', z: 'side' },
          ];

          window.FOODS = [
            // VERDURAS
            { id:'lechuga',  cat:'veg', n:'Lechuga',            e:'🥬', p:'1 taza (50 g)',      k:8,   pr:0.6, c:1.5, g:0.1 },
            { id:'tomate',   cat:'veg', n:'Tomate',             e:'🍅', p:'1 unidad (120 g)',   k:22,  pr:1.1, c:4.7, g:0.2 },
            { id:'pepino',   cat:'veg', n:'Pepino',             e:'🥒', p:'½ unidad (150 g)',   k:18,  pr:0.9, c:3.3, g:0.2 },
            { id:'zanahoria',cat:'veg', n:'Zanahoria rallada',  e:'🥕', p:'½ taza (55 g)',      k:23,  pr:0.5, c:5.3, g:0.1 },
