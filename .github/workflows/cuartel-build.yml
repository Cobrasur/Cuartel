            <div class="card">
              <h3>⚙️ Ajustes</h3>
              <div class="toggle"><div><div>Recordatorios</div><div class="small muted">Agua cada hora, circuitos y pesaje del lunes</div></div><button class="switch ${S.settings.reminders ? 'on' : ''}" data-act="reminders" aria-label="Recordatorios"></button></div>
              <div class="actions"><button class="btn" data-act="profileOpen">Mis datos</button><button class="btn" data-act="backupOpen">Respaldo</button></div>
            </div>`;
            loadPhotos();
            $('#photoInput').addEventListener('change', onPhoto);
          }

          // IndexedDB para fotos
          let dbP;
          function db() {
            if (!dbP) dbP = new Promise((res, rej) => { const r = indexedDB.open('cuartel', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
            return dbP;
          }
          async function loadPhotos() {
            try {
              const d = await db();
              PHOTOS = await new Promise((res, rej) => { const q = d.transaction('photos').objectStore('photos').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
              const el = $('#photos'); if (!el) return;
              el.innerHTML = PHOTOS.length ? PHOTOS.sort((a, b) => a.id - b.id).map(ph => `<figure><img src="${ph.data}" alt="Foto ${shortDate(ph.date)}"><figcaption>${shortDate(ph.date)}</figcaption></figure>`).join('') : '<p class="muted small">Aún sin fotos.</p>';
            } catch (e) { const el = $('#photos'); if (el) el.innerHTML = '<p class="muted small">No se pudieron cargar las fotos.</p>'; }
          }
          function onPhoto(e) {
            const file = e.target.files[0]; if (!file) return;
            const img = new Image(), url = URL.createObjectURL(file);
            img.onload = async () => {
              const max = 720, sc = Math.min(1, max / Math.max(img.width, img.height));
              const c = document.createElement('canvas'); c.width = img.width * sc; c.height = img.height * sc;
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
              const data = c.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url);
              try { const d = await db(); await new Promise((res, rej) => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').put({ id: Date.now(), date: today(), data }); t.oncomplete = res; t.onerror = () => rej(t.error); }); toast('Foto guardada 📸'); loadPhotos(); }
              catch (err) { toast('No se pudo guardar la foto', true); }
            };
            img.src = url;
          }

          // ---------- recordatorios (solo en la app instalada) ----------
          function notifPlugin() {
            const C = window.Capacitor;
            if (!C || !C.isNativePlatform || !C.isNativePlatform()) return null;
            try { return (C.Plugins && C.Plugins.LocalNotifications) || C.registerPlugin('LocalNotifications'); } catch (e) { return null; }
          }
          const WATER_LINES = ['💧 ¡Agua, soldado! Un vaso ahora.', '💧 ¿Cuánta agua llevas? Ve por un vaso. ¡YA!', '💧 La sed no se negocia. ¡Hidrátate!', '💧 Párate, camina 3 minutos y toma agua.'];
          async function setReminders(on) {
            const LN = notifPlugin();
            if (!LN) { toast('Los recordatorios funcionan en la app instalada'); return on; }
            try {
              const pend = await LN.getPending();
              if (pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
              if (!on) return false;
              const perm = await LN.requestPermissions();
              if (perm.display !== 'granted') { toast('Debes permitir las notificaciones', true); return false; }
              const list = [];
              for (let h = 9; h <= 20; h++) list.push({ id: 100 + h, title: 'CUARTEL · Agua', body: WATER_LINES[h % WATER_LINES.length], schedule: { on: { hour: h, minute: 0 } } });
              list.push({ id: 201, title: 'CUARTEL · Circuito', body: '🏢 Primer circuito de oficina. 10 minutos. ¡Muévete!', schedule: { on: { hour: 11, minute: 15 } } });
              list.push({ id: 202, title: 'CUARTEL · Circuito', body: '🏢 Segundo circuito del día. Sin excusas, recluta.', schedule: { on: { hour: 16, minute: 30 } } });
              list.push({ id: 203, title: 'CUARTEL · Pesaje', body: '⚖️ Lunes de pesaje. En ayunas a la balanza, y mide la cintura.', schedule: { on: { weekday: 2, hour: 8, minute: 0 } } });
              list.push({ id: 204, title: 'CUARTEL · Cena', body: '🌙 Cena: proteína y verduras. Nada de carbohidratos.', schedule: { on: { hour: 19, minute: 45 } } });
              await LN.schedule({ notifications: list });
              toast('Recordatorios activados 🔔');
              return true;
            } catch (e) { toast('No se pudieron programar', true); return false; }
          }

          // ---------- acciones ----------
          document.addEventListener('click', async e => {
            const el = e.target.closest('[data-act]'); if (!el) return;
            const a = el.dataset.act, dd = day();
            switch (a) {
              case 'setupGo': {
                const age = +$('#sAge').value, h = +$('#sH').value, w = +$('#sW').value, waist = +$('#sWaist').value || null, goal = +$('#sGoal').value || 10;
                if (!age || age < 15 || age > 90) return toast('Falta tu edad, recluta', true);
                if (!h || !w) return toast('Faltan estatura o peso', true);
                S.profile = { name: $('#sName').value.trim() || 'Recluta', age, height: h, startWeight: w, goal, startDate: today() };
                S.weights = [{ date: today(), kg: w, waist }];
                S.soda.cleanSince = today();
                save(); TAB = 'cuartel'; render();
                modal(`<div style="text-align:center"><div style="font-size:60px">🪖</div><h2>ALISTADO</h2>
                  <p>Tu ración diaria: <b>${fmt(targets().kcal)} kcal</b> y <b>${targets().prot} g de proteína</b>.</p>
                  <p class="muted small">Hoy es tu día 1 sin bebidas. Si caes, toca \"Me equivoqué\" y el contador vuelve a cero. Sin trampas.</p>
                  <button class="btn primary block" data-act="closeModal">¡A LA ORDEN!</button></div>`);
                break;
              }
              case 'closeModal': closeModal(); break;
              case 'goto': go(el.dataset.tab); break;
              case 'water': {
                const ml = +el.dataset.ml; dd.water = Math.max(0, dd.water + ml); save();
                if (ml > 0 && dd.water >= WATER_GOAL && dd.water - ml < WATER_GOAL) toast('🎖️ ¡3 litros! Orden cumplida.'); else if (ml > 0) toast(`+${ml} ml 💧`);
                renderCuartel(); break;
              }
              case 'relapseOpen':
                modal(`<h2>Registrar recaída</h2><p class="muted small">Ser honesto es parte de la disciplina. ¿Cuánto tomaste?</p>
                  <div class="actions" style="flex-wrap:wrap">
                  ${[[200, 'Un vaso'], [350, 'Una lata'], [500, 'Medio litro'], [1500, '1,5 L'], [3000, '3 L']].map(([ml, t]) => `<button class="btn" style="flex:1 1 40%" data-act="relapse" data-ml="${ml}">${t}</button>`).join('')}
                  </div><div class="actions"><button class="btn" data-act="closeModal">Cancelar</button></div>
                  ${S.soda.relapses.length ? `<p class="small muted mt">Recaídas registradas: ${S.soda.relapses.length} · total ${fmt(S.soda.relapses.reduce((a, r) => a + r.ml, 0))} ml</p>` : ''}`);
                break;
              case 'relapse': relapse(+el.dataset.ml, 'manual'); closeModal(); toast('Registrado. Mañana partes de nuevo. 🫡', true); render(); break;
              case 'med': S.med[el.dataset.id] = !S.med[el.dataset.id]; save(); render(); break;

              // plato
              case 'meal': MEAL = el.dataset.id; renderPlato(); break;
              case 'cat': CAT = el.dataset.id; QUERY = ''; $('#foodSearch').value = ''; $('#foodGrid').innerHTML = foodGrid(); $$('.cat-tabs .chip').forEach(c => c.classList.toggle('on', c.dataset.id === CAT)); break;
              case 'add': addFood(el.dataset.id, el); break;
              case 'addSodaConfirm': {
                const f = food(el.dataset.id); closeModal();
                const ml = /1,5/.test(f.p) ? 1500 : 350;
                relapse(ml, f.n); doAdd(f.id, null); toast('Recaída registrada. Racha en cero.', true); break;
              }
              case 'qty': {
                const items = dd.meals[MEAL], i = +el.dataset.i, d = +el.dataset.d;
                const before = mealTotals(items).k, beforeDay = dayTotals().k;
                items[i].q = r1(items[i].q + d); if (items[i].q <= 0) items.splice(i, 1);
                save(); refreshPlate(before, beforeDay); break;
              }
              case 'customOpen':
                modal(`<h2>⭐ Nuevo alimento</h2><p class="small muted">Copia los datos de la etiqueta nutricional, por porción.</p>
                  <label class="f">Nombre<input id="cN" placeholder="Ej: Barra de proteína"></label>
                  <label class="f">Porción<input id="cP" placeholder="Ej: 1 barra (40 g)"></label>
                  <div class="grid2"><label class="f">Calorías<input id="cK" type="number" inputmode="decimal"></label><label class="f">Proteína (g)<input id="cPr" type="number" inputmode="decimal"></label>
                  <label class="f">Carbohidratos (g)<input id="cC" type="number" inputmode="decimal"></label><label class="f">Grasa (g)<input id="cG" type="number" inputmode="decimal"></label></div>
                  <label class="f">Va en el plato como<select id="cCat"><option value="veg">Verdura</option><option value="prot">Proteína</option><option value="carb">Carbohidrato</option><option value="fruta">Fruta</option><option value="lacteo">Lácteo</option><option value="grasa" selected>Extra / snack</option><option value="bebida">Bebida</option><option value="plato">Plato preparado</option></select></label>
                  <div class="actions"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="customSave">Guardar</button></div>`);
                break;
              case 'customSave': {
                const n = $('#cN').value.trim(), k = +$('#cK').value;
                if (!n || !k) return toast('Falta nombre o calorías', true);
                const cat = $('#cCat').value, emo = { veg: '🥬', prot: '🍗', carb: '🍞', fruta: '🍎', lacteo: '🥛', grasa: '⭐', bebida: '🥤', plato: '🍲' }[cat];
                S.customFoods.push({ id: 'c_' + Date.now(), custom: true, cat, n, e: emo, p: $('#cP').value.trim() || '1 porción', k, pr: +$('#cPr').value || 0, c: +$('#cC').value || 0, g: +$('#cG').value || 0 });
                save(); closeModal(); CAT = 'mios'; renderPlato(); toast('Alimento guardado ⭐'); break;
              }

              // entreno
              case 'drillStart': DRILL = { i: 0, set: 0, phase: 'work' }; renderDrill(); window.scrollTo(0, 0); break;
              case 'drillQuit': DRILL = null; stopDrillTimer(); renderEntreno(); break;
              case 'setDone': {
                const e = EX[exFor(CIRCUIT[DRILL.i])];
                DRILL.set++;
                if (DRILL.set >= e.sets) { DRILL.phase = 'feel'; renderDrill(); } else startRest();
                break;
              }
              case 'skipRest': stopDrillTimer(); DRILL.phase = 'work'; renderDrill(); break;
              case 'swap': {
                const b = CIRCUIT[DRILL.i]; S.training.alt[b] = !S.training.alt[b]; save();
                toast(`Cambiado a: ${EX[exFor(b)].n}`); DRILL.phase = 'work'; renderDrill(); break;
              }
              case 'feel': {
                const id = exFor(CIRCUIT[DRILL.i]), f = el.dataset.f, ex = EX[id];
                if (f === 'easy') {
                  S.training.easy[id] = (S.training.easy[id] || 0) + 1;
                  if (ex.w && S.training.easy[id] >= 2) { S.training.kg[id] = Math.min(10, kgFor(id) + 1); S.training.easy[id] = 0; toast(`💪 Subes a ${kgFor(id)} kg en ${ex.n}`); }
                  else if (!ex.w && S.training.easy[id] >= 2) { toast('Muy fácil: la próxima vez haz 2 repeticiones más.'); S.training.easy[id] = 0; }
                } else S.training.easy[id] = 0;
                save(); nextExercise(); break;
              }
              case 'kg': { const id = el.dataset.id; S.training.kg[id] = clamp(kgFor(id) + +el.dataset.d, 1, 10); save(); DRILL ? renderDrill() : renderEntreno(); break; }
              case 'marchOpen':
                modal(`<h2>🎒 Registrar marcha</h2>
                  <label class="f">Minutos<input id="mMin" type="number" inputmode="numeric" value="${dd.march?.min || marchTarget()}"></label>
                  <label class="f">Peso en la mochila (kg)<input id="mKg" type="number" inputmode="decimal" value="${dd.march?.kg || 0}"></label>
                  <div class="actions"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="marchSave">Guardar</button></div>`);
                break;
              case 'marchSave': {
                const min = +$('#mMin').value; if (!min) return toast('¿Cuántos minutos?', true);
                dd.march = { min, kg: +$('#mKg').value || 0 }; save(); closeModal();
                toast(min >= marchTarget() ? '🎖️ ¡Meta de marcha cumplida!' : `Registrado. La meta era ${marchTarget()} min.`); renderEntreno(); break;
              }

              // progreso
              case 'weighOpen':
                modal(`<h2>⚖️ Pesaje</h2><p class="small muted">En ayunas, después de ir al baño. Siempre igual.</p>
                  <label class="f">Peso (kg)<input id="wKg" type="number" inputmode="decimal" step="0.1" value="${r1(currentWeight())}"></label>
                  <label class="f">Cintura (cm)<input id="wWaist" type="number" inputmode="decimal" step="0.5" placeholder="opcional"></label>
                  <div class="actions"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="weighSave">Guardar</button></div>`);
                break;
              case 'weighSave': {
                const kg = +$('#wKg').value, waist = +$('#wWaist').value || null;
                if (!kg || kg < 40 || kg > 250) return toast('Peso no válido', true);
                const prev = currentWeight();
                S.weights = S.weights.filter(w => w.date !== today()); S.weights.push({ date: today(), kg, waist });
                S.weights.sort((a, b) => a.date < b.date ? -1 : 1); save(); closeModal();
                const diff = r1(prev - kg);
                toast(diff > 0 ? `🎖️ -${diff} kg. ¡Así se avanza!` : diff < 0 ? `+${Math.abs(diff)} kg. Revisa las órdenes y aprieta.` : 'Igual que antes. Aprieta esta semana.', diff < 0);
                renderProgreso(); break;
              }
              case 'photoAdd': $('#photoInput').click(); break;
              case 'reminders': { const want = !S.settings.reminders; S.settings.reminders = await setReminders(want); save(); renderProgreso(); break; }
              case 'profileOpen': {
                const p = S.profile;
                modal(`<h2>Mis datos</h2>
                  <label class="f">Nombre<input id="pN" value="${esc(p.name)}"></label>
                  <div class="grid2"><label class="f">Edad<input id="pA" type="number" value="${p.age}"></label><label class="f">Estatura (cm)<input id="pH" type="number" value="${p.height}"></label>
                  <label class="f">Peso inicial<input id="pW" type="number" step="0.1" value="${p.startWeight}"></label><label class="f">Meta (kg)<input id="pG" type="number" value="${p.goal}"></label></div>
                  <label class="f">Inicio de la misión<input id="pD" type="date" value="${p.startDate}"></label>
                  <div class="actions"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="profileSave">Guardar</button></div>`);
                break;
              }
              case 'profileSave':
                Object.assign(S.profile, { name: $('#pN').value.trim() || S.profile.name, age: +$('#pA').value || S.profile.age, height: +$('#pH').value || S.profile.height, startWeight: +$('#pW').value || S.profile.startWeight, goal: +$('#pG').value || S.profile.goal, startDate: $('#pD').value || S.profile.startDate });
                save(); closeModal(); render(); toast('Datos actualizados'); break;
              case 'backupOpen':
                modal(`<h2>💾 Respaldo</h2><p class="small muted">Tus datos viven solo en este teléfono. Copia este texto y guárdalo (por ejemplo, mándatelo por correo). Para restaurar, pega un respaldo y toca Restaurar. Las fotos no se incluyen.</p>
                  <textarea id="bk" rows="6" style="font-size:11px">${esc(JSON.stringify(S))}</textarea>
                  <div class="actions"><button class="btn" data-act="backupCopy">Copiar</button><button class="btn danger" data-act="backupRestore">Restaurar</button></div>
                  <div class="actions"><button class="btn" data-act="closeModal">Cerrar</button></div>`);
                break;
              case 'backupCopy': { const t = $('#bk'); t.select(); try { await navigator.clipboard.writeText(t.value); toast('Copiado 📋'); } catch (err) { document.execCommand('copy'); toast('Copiado 📋'); } break; }
              case 'backupRestore': {
                try { const d = JSON.parse($('#bk').value); if (!d.profile) throw 0; S = Object.assign(DEFAULT(), d); save(); closeModal(); render(); toast('Respaldo restaurado'); }
                catch (err) { toast('Ese texto no es un respaldo válido', true); }
                break;
              }
            }
          });

          // refrescar al volver a la app (cambio de día, hora, etc.)
          document.addEventListener('visibilitychange', () => { if (!document.hidden && !DRILL) render(); });

          render();
          })();
          CUARTEL_EOF
          echo "" | base64 -d > debug.keystore

      - name: Instalar dependencias y fuentes
        run: |
          npm install
          F=node_modules/@fontsource
          cp $F/black-ops-one/files/black-ops-one-latin-400-normal.woff2 www/fonts/blackops.woff2
          for w in 400 600 800; do
            cp $F/inter/files/inter-latin-$w-normal.woff2 www/fonts/inter-$w.woff2
            cp $F/inter/files/inter-latin-ext-$w-normal.woff2 www/fonts/inter-ext-$w.woff2
          done

      - name: Dibujar icono
        continue-on-error: true
        run: |
          pip install pillow
          cat > icon.py <<'CUARTEL_EOF'
          from PIL import Image, ImageDraw
          import math
          def icon(size):
              im=Image.new('RGB',(size,size),'#12150f'); d=ImageDraw.Draw(im)
              c=size/2; r=size*0.34
              d.ellipse([c-r,c-r,c+r,c+r],fill='#f2b134'); r2=r*0.93
              d.ellipse([c-r2,c-r2,c+r2,c+r2],fill='#34401f')
              R=r*0.55; rr=R*0.42; pts=[]
              for i in range(10):
                  a=-math.pi/2+i*math.pi/5; rad=R if i%2==0 else rr
                  pts.append((c+rad*math.cos(a), c+rad*math.sin(a)))
              d.polygon(pts,fill='#f2b134'); return im
          icon(1024).save('assets/icon.png'); icon(1024).save('assets/icon-only.png')
          icon(1024).save('assets/icon-foreground.png')
          Image.new('RGB',(1024,1024),'#12150f').save('assets/icon-background.png')
          sp=Image.new('RGB',(2732,2732),'#12150f'); sp.paste(icon(800),(966,966)); sp.save('assets/splash.png'); sp.save('assets/splash-dark.png')
          CUARTEL_EOF
          python3 icon.py

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar icono Android
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#12150f' --iconBackgroundColorDark '#12150f' --splashBackgroundColor '#12150f' --splashBackgroundColorDark '#12150f'

      - name: Sincronizar
        run: npx cap sync android

      # Llave fija: cada versión nueva se instala encima de la anterior sin borrar tus datos
      - name: Llave de firma
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Cuartel.apk
          gh release delete ultima --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create ultima Cuartel.apk -R "$GITHUB_REPOSITORY" --title "Cuartel" --notes "Version ${{ github.run_number }}. Descarga Cuartel.apk e instalala." --latest
