          // ================= PROGRESO =================
          let PHOTOS = [];
          function chartSVG() {
            const W = 340, H = 190, L = 34, R = 22, Tm = 10, B = 24;
            const p = S.profile, pts = S.weights.map(w => ({ x: daysBetween(p.startDate, w.date), y: w.kg }));
