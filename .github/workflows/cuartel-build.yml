          cat > www/app.js <<'CUARTEL_EOF'
          /* CUARTEL — app personal de hábitos, alimentación y entrenamiento.
             Todo se guarda solo en este teléfono (localStorage + IndexedDB para fotos). */
          (() => {
          'use strict';

          // ---------- utilidades ----------
          const $ = (s, el = document) => el.querySelector(s);
          const $$ = (s, el = document) => [...el.querySelectorAll(s)];
          const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
          const r0 = n => Math.round(n);
          const r1 = n => Math.round(n * 10) / 10;
          const fmt = n => r0(n).toLocaleString('es-CL');
          const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
          const pad = n => String(n).padStart(2, '0');
          const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          const today = () => dstr(new Date());
          const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
          const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
          const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
          const shortDate = s => { const d = parseD(s); return `${d.getDate()}/${d.getMonth() + 1}`; };

          // ---------- estado ----------
          const KEY = 'cuartel_v1';
          const DEFAULT = () => ({
            profile: null,
            days: {},
            soda: { cleanSince: null, best: 0, relapses: [] },
            weights: [],
            training: { kg: {}, easy: {}, alt: {} },
            customFoods: [],
            med: {},
            settings: { reminders: false },
          });
          let S;
          try { S = Object.assign(DEFAULT(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); }
          catch (e) { S = DEFAULT(); }
          const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar', true); } };
          const day = (d = today()) => {
            if (!S.days[d]) S.days[d] = { water: 0, meals: {}, circuits: 0, march: null };
            return S.days[d];
          };

          // ---------- perfil y metas ----------
          const MEALS = [
            { id: 'desayuno', n: 'Desayuno', e: '🌅' },
            { id: 'colacion1', n: 'Colación AM', e: '🍎' },
            { id: 'almuerzo', n: 'Almuerzo', e: '☀️' },
            { id: 'colacion2', n: 'Colación PM', e: '🥛' },
            { id: 'once', n: 'Once', e: '🫖' },
            { id: 'cena', n: 'Cena', e: '🌙' },
          ];
          const WATER_GOAL = 3000;
          const currentWeight = () => S.weights.length ? S.weights[S.weights.length - 1].kg : S.profile.startWeight;
          function targets() {
            const p = S.profile, w = currentWeight();
            const bmr = 10 * w + 6.25 * p.height - 5 * p.age + 5;
            const tdee = bmr * 1.35;
            const kcal = Math.max(1500, Math.round((tdee - 1000) / 50) * 50);
            const prot = Math.min(160, Math.round(w * 1.2 / 5) * 5);
            return { kcal, prot, carbs: Math.round(kcal * 0.35 / 4), fat: Math.round(kcal * 0.30 / 9), tdee: Math.round(tdee) };
          }
          const imc = w => w / Math.pow(S.profile.height / 100, 2);
          const missionDay = () => daysBetween(S.profile.startDate, today()) + 1;

          // ---------- alimentos ----------
          const allFoods = () => FOODS.concat(S.customFoods);
          const food = id => allFoods().find(f => f.id === id);
          const catOf = f => CATS.find(c => c.id === f.cat) || CATS[CATS.length - 1];
          const VEG_IN_DISH = { cazuela: 1, charquican: 1, porotosriendas: 1, ensaladapollo: 2, tortillaverd: 1, lentejasguiso: 1 };
          function mealTotals(items) {
            const t = { k: 0, pr: 0, c: 0, g: 0, veg: 0, prot: 0, carb: 0, soda: 0 };
            for (const it of items) {
              const f = food(it.id); if (!f) continue;
              t.k += f.k * it.q; t.pr += f.pr * it.q; t.c += f.c * it.q; t.g += f.g * it.q;
              if (f.cat === 'veg') t.veg += it.q;
              if (f.cat === 'prot') t.prot += it.q;
              if (f.cat === 'carb') t.carb += it.q;
              if (f.cat === 'plato') { t.veg += (VEG_IN_DISH[f.id] || 0) * it.q; if (f.c > 25) t.carb += it.q; if (f.pr >= 15) t.prot += it.q; }
              if (f.soda) t.soda += it.q;
            }
            return t;
          }
          function dayTotals(d = today()) {
            const dd = day(d), t = { k: 0, pr: 0, c: 0, g: 0 };
            for (const m of MEALS) { const mt = mealTotals(dd.meals[m.id] || []); t.k += mt.k; t.pr += mt.pr; t.c += mt.c; t.g += mt.g; }
            return t;
          }

          // ---------- bebidas (racha) ----------
          function streak() {
            if (!S.soda.cleanSince) return 0;
            // el día de hoy cuenta si no hubo recaída; tras una recaída cleanSince es mañana → 0
            return Math.max(0, daysBetween(S.soda.cleanSince, today()) + 1);
          }
          function relapse(ml, label) {
            const cur = streak();
            S.soda.best = Math.max(S.soda.best, cur);
            S.soda.relapses.push({ date: today(), ml, label });
            S.soda.cleanSince = addDays(today(), 1);
            save();
          }
          const relapsedToday = () => S.soda.relapses.some(r => r.date === today());

          // ---------- órdenes del día ----------
          function orders() {
            const dd = day(), m = dd.meals;
            const mainMeals = ['desayuno', 'almuerzo', 'cena'];
            const protOK = mainMeals.every(id => (m[id] || []).length && mealTotals(m[id]).pr >= 15);
            const cena = m.cena || [];
            const cenaOK = cena.length > 0 && !cena.some(it => { const f = food(it.id); return f && (f.cat === 'carb' || (f.cat === 'plato' && f.c > 25)); });
            const dt = dayTotals(), T = targets();
            return [
              { id: 'agua', t: `${WATER_GOAL / 1000} litros de agua`, done: dd.water >= WATER_GOAL, info: `${fmt(dd.water)} ml` },
              { id: 'bebida', t: 'Cero bebidas', done: !relapsedToday(), info: relapsedToday() ? 'caíste' : 'firme' },
              { id: 'prot', t: 'Proteína en desayuno, almuerzo y cena', done: protOK },
              { id: 'cena', t: 'Cena sin carbohidratos', done: cenaOK },
              { id: 'circ', t: '2 circuitos de oficina', done: dd.circuits >= 2, info: `${dd.circuits}/2` },
              { id: 'marcha', t: 'Caminata o marcha', done: !!(dd.march && dd.march.min > 0), info: dd.march ? `${dd.march.min} min` : '' },
              { id: 'kcal', t: `Dentro de la ración (${fmt(T.kcal)} kcal)`, done: dt.k > 0 && dt.k <= T.kcal, info: `${fmt(dt.k)}` },
            ];
          }

          // ---------- instructor ----------
          const BANK = [
            'La disciplina es hacer lo que hay que hacer, aunque no tengas ganas. ¡Hoy también!',
            'Nadie va a hacer esto por ti, soldado. Ni tu mamá, ni tu señora, ni yo. Tú.',
            'Agua, proteína, verdura y movimiento. No es complicado. Es difícil. Son cosas distintas.',
            'El hambre de verdad se come una manzana. Si no te comerías una manzana, no es hambre.',
            'Cada día cumplido es un ladrillo. Construye, recluta.',
            'La reserva no espera a los que lo dejaron para el lunes.',
            'No te pido perfección. Te pido que no abandones.',
            'Si fallas una comida, no fallas el día. Si fallas el día, no fallas la misión. ¡Sigue!',
            'Tu cuerpo sigue órdenes. Dale buenas órdenes.',
            'Menos excusas, más agua. ¡Hidrátate!',
          ];
          function sarge() {
            const dd = day(), h = new Date().getHours(), T = targets(), dt = dayTotals(), st = streak();
            if (relapsedToday()) return { face: '😤', msg: 'Hoy caíste con la bebida. Quedó registrado. No hay castigo, hay corrección: mañana el contador parte de cero y no se vuelve a repetir.' };
            if (dt.k > T.kcal + 50) return { face: '🫡', msg: `Te pasaste ${fmt(dt.k - T.kcal)} kcal de la ración. Se cerró la cocina por hoy. Solo agua y verduras, soldado.` };
            const expected = clamp((h - 8) / 12, 0, 1) * WATER_GOAL;
            if (h >= 10 && h <= 21 && dd.water < expected - 600) return { face: '😠', msg: `¡${fmt(dd.water)} ml de agua a las ${h}:00! Eso no es hidratarse, es sobrevivir. Levántate y ve por agua. ¡AHORA!` };
            if (h >= 12 && dd.circuits === 0) return { face: '😤', msg: `Son las ${h}:00 y cero circuitos. Son diez minutos y ni vas a sudar. ¡Muévete, recluta!` };
            const weekday = new Date().getDay();
            const weighedThisWeek = S.weights.some(w => daysBetween(w.date, today()) < 7);
            if (weekday === 1 && !weighedThisWeek) return { face: '📏', msg: 'Lunes de pesaje. A la balanza en ayunas, después del baño. Y mide la cintura. ¡Sin excusas!' };
            if (st >= 1 && st <= 3) return { face: '💧', msg: `Día ${st} sin bebidas. Si te duele la cabeza es la falta de cafeína y azúcar: se pasa en unos días. Tu munición es el agua. ¡Aguanta!` };
            if ([7, 14, 21, 30, 60, 90].includes(st)) return { face: '🎖️', msg: `¡${st} DÍAS SIN BEBIDAS! Eso es disciplina de verdad. Medalla ganada, soldado. Ahora a mantenerla.` };
            if (orders().every(o => o.done)) return { face: '🎖️', msg: 'Todas las órdenes cumplidas. Así se hace. Descanso merecido, soldado.' };
            return { face: '🪖', msg: BANK[(missionDay() + h) % BANK.length] };
          }

          // ---------- toast / modal ----------
          let toastT;
          function toast(msg, bad = false) {
            const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
            clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 2600);
          }
          function modal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); }
          function closeModal() { $('#modalBg').classList.remove('show'); }
          $('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });

          // ---------- navegación ----------
          let TAB = 'cuartel';
          function go(tab) {
            TAB = tab;
            $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
            stopDrillTimer();
            render();
            window.scrollTo(0, 0);
          }
          $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

          function render() {
            if (!S.profile) { $('#tabs').style.display = 'none'; $('#missionChip').style.display = 'none'; return renderSetup(); }
            $('#tabs').style.display = ''; $('#missionChip').style.display = '';
            $('#missionChip').textContent = missionDay() <= 30 ? `DÍA ${missionDay()}/30` : `DÍA ${missionDay()}`;
            ({ cuartel: renderCuartel, plato: renderPlato, entreno: renderEntreno, progreso: renderProgreso })[TAB]();
          }

          // ================= SETUP =================
          function renderSetup() {
            $('#view').innerHTML = `
            <div class="setup">
              <div class="card sarge"><div class="face">🪖</div><div><div class="label">INSTRUCTOR</div>
                <div class="msg">Atención, recluta. Antes de empezar necesito tus datos. Sin mentir: la balanza no negocia.</div></div></div>
              <h1>Alistamiento</h1>
              <p class="muted small">Estos datos quedan solo en tu teléfono.</p>
              <div class="card">
                <label class="f">Nombre<input id="sName" value="Álvaro"></label>
                <div class="grid2">
                  <label class="f">Edad<input id="sAge" type="number" inputmode="numeric" placeholder="años"></label>
                  <label class="f">Estatura (cm)<input id="sH" type="number" inputmode="numeric" value="165"></label>
                  <label class="f">Peso actual (kg)<input id="sW" type="number" inputmode="decimal" step="0.1" value="106"></label>
                  <label class="f">Cintura (cm)<input id="sWaist" type="number" inputmode="decimal" placeholder="opcional"></label>
                </div>
                <label class="f">Meta del primer mes (kg a bajar)<input id="sGoal" type="number" inputmode="decimal" value="10"></label>
                <p class="small muted">Mide la cintura a la altura del ombligo, sin apretar la huincha y sin meter la guata.</p>
                <button class="btn primary block" data-act="setupGo">¡ME ALISTO!</button>
              </div>
            </div>`;
          }

          // ================= CUARTEL =================
          function glassSVG(ml) {
            const pct = clamp(ml / WATER_GOAL, 0, 1), H = 92, y = 6 + H * (1 - pct);
            return `<svg class="glass" viewBox="0 0 74 104" aria-hidden="true">
              <defs><clipPath id="gclip"><path d="M8 6 L66 6 L60 98 L14 98 Z"/></clipPath></defs>
              <path d="M8 6 L66 6 L60 98 L14 98 Z" fill="#0d100a" stroke="#4a5634" stroke-width="3"/>
              <g clip-path="url(#gclip)"><rect class="fill" x="0" y="${y}" width="74" height="${H}" fill="#4aa3df" opacity=".85"/>
              <path d="M0 ${y} q9 -4 18 0 t18 0 t18 0 t18 0 v6 h-72z" fill="#7cc4f2" opacity=".8"/></g>
              <text x="37" y="60" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Inter">${r0(pct * 100)}%</text></svg>`;
          }
          function renderCuartel() {
            const dd = day(), sg = sarge(), st = streak(), T = targets(), dt = dayTotals();
            const os = orders(), done = os.filter(o => o.done).length;
            const lost = r1(S.profile.startWeight - currentWeight());
            const md = missionDay();
            $('#view').innerHTML = `
            <div class="card sarge"><div class="face">${sg.face}</div><div><div class="label">INSTRUCTOR · ${esc(S.profile.name.toUpperCase())}</div><div class="msg">${esc(sg.msg)}</div></div></div>

            <div class="card">
              <div class="row between"><h2>💧 Agua</h2><span class="muted small num">${fmt(dd.water)} / ${fmt(WATER_GOAL)} ml</span></div>
              <div class="water mt">${glassSVG(dd.water)}
                <div style="flex:1">
                  <div class="small muted">Te faltan</div>
                  <div class="big">${fmt(Math.max(0, WATER_GOAL - dd.water))}<span class="small muted"> ml</span></div>
                  <div class="water-btns">
                    <button class="btn primary" data-act="water" data-ml="250">+ Vaso</button>
                    <button class="btn" data-act="water" data-ml="500">+ ½ L</button>
                    <button class="btn sm" data-act="water" data-ml="-250">↶</button>
                  </div>
                </div></div>
            </div>

            <div class="grid2 mb">
              <div class="card streak ${st === 0 ? 'zero' : ''}">
                <div class="small muted">Sin bebidas</div>
                <div class="row"><span class="big">${st}</span><span class="flame">${st === 0 ? '⚠️' : st >= 7 ? '🔥' : '🥤🚫'}</span></div>
                <div class="small muted">días · récord ${Math.max(S.soda.best, st)}</div>
                <button class="btn sm danger mt" data-act="relapseOpen">Me equivoqué</button>
              </div>
              <div class="card">
                <div class="small muted">Misión 30 días</div>
                <div class="row"><span class="big">${lost > 0 ? '-' : ''}${Math.abs(lost)}</span><span class="small muted">kg</span></div>
                <div class="small muted">meta -${S.profile.goal} kg · día ${Math.min(md, 30)}</div>
                <div class="bar mt ${lost >= S.profile.goal ? 'ok' : ''}"><i style="width:${clamp(lost / S.profile.goal * 100, 0, 100)}%"></i></div>
              </div>
            </div>

            <div class="card">
              <div class="row between"><h2>🍽️ Ración de hoy</h2><span class="pill ${dt.k > T.kcal ? 'bad' : 'ok'}">${fmt(dt.k)} / ${fmt(T.kcal)} kcal</span></div>
              <div class="bar mt ${dt.k > T.kcal ? 'bad' : ''}"><i style="width:${clamp(dt.k / T.kcal * 100, 0, 100)}%"></i></div>
              <div class="macro"><span>Proteína</span><div class="bar ok"><i style="width:${clamp(dt.pr / T.prot * 100, 0, 100)}%"></i></div><span class="v">${r0(dt.pr)}/${T.prot} g</span></div>
              <button class="btn block mt" data-act="goto" data-tab="plato">Armar mi plato →</button>
            </div>

            <div class="card">
              <div class="row between mb"><h2>📋 Órdenes del día</h2><span class="pill ${done === os.length ? 'ok' : ''}">${done}/${os.length}</span></div>
              ${os.map(o => `<div class="order ${o.done ? 'done' : ''}"><span class="check">${o.done ? '✓' : ''}</span><span class="txt">${esc(o.t)}</span><span class="auto">${esc(o.info || '')}</span></div>`).join('')}
              <p class="small muted mt">Las órdenes se marcan solas según lo que registres.</p>
            </div>

            ${medCard(true)}
            `;
          }

          const MED_ITEMS = [
            { id: 'hora', t: 'Pedir hora (EMP en CESFAM o médico)' },
            { id: 'glic', t: 'Glicemia en ayunas' },
            { id: 'insu', t: 'Insulina basal (índice HOMA)' },
            { id: 'hba1c', t: 'Hemoglobina glicosilada' },
            { id: 'lip', t: 'Perfil lipídico (colesterol)' },
            { id: 'piel', t: 'Mostrar las manchas oscuras de la piel' },
          ];
          function medCard(compact) {
            const n = MED_ITEMS.filter(m => S.med[m.id]).length;
            if (compact && n === MED_ITEMS.length) return '';
            return `<div class="card medlist">
              <div class="row between mb"><h2>🩺 Misión médica</h2><span class="pill ${n === MED_ITEMS.length ? 'ok' : 'bad'}">${n}/${MED_ITEMS.length}</span></div>
              ${MED_ITEMS.map(m => `<div class="order ${S.med[m.id] ? 'done' : ''}" data-act="med" data-id="${m.id}"><span class="check">${S.med[m.id] ? '✓' : ''}</span><span class="txt">${m.t}</span></div>`).join('')}
              <p class="small muted mt">Tus señales apuntan a resistencia a la insulina. Esto confirma dónde estás parado. Toca cada punto cuando lo cumplas.</p>
            </div>`;
          }

          // ================= PLATO =================
          let MEAL = null, CAT = 'veg', QUERY = '';
          function defaultMeal() {
            const h = new Date().getHours();
            if (h < 10) return 'desayuno'; if (h < 12) return 'colacion1'; if (h < 15) return 'almuerzo';
            if (h < 17) return 'colacion2'; if (h < 20) return 'once'; return 'cena';
          }
          const CX = 150, CY = 150, RIM = 142, IN = 120;
          const ZONES = {
            veg: { a0: 90, a1: 270, color: 'var(--veg)', label: 'VERDURAS', lx: 78, ly: 154, target: 2 },
            prot: { a0: 270, a1: 360, color: 'var(--prot)', label: 'PROTEÍNA', lx: 196, ly: 104, target: 1 },
            carb: { a0: 0, a1: 90, color: 'var(--carb)', label: 'CARBO', lx: 196, ly: 204, target: 1 },
          };
          const rad = a => a * Math.PI / 180;
          function wedge(a0, a1, r) {
            const x0 = CX + r * Math.cos(rad(a0)), y0 = CY + r * Math.sin(rad(a0));
            const x1 = CX + r * Math.cos(rad(a1)), y1 = CY + r * Math.sin(rad(a1));
            return `M${CX} ${CY} L${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1} Z`;
          }
          // posición estable pseudoaleatoria por índice
          function seeded(i) { const x = Math.sin(i * 9301 + 49297) * 233280; return x - Math.floor(x); }
          function tokenPos(zone, i) {
            if (zone === 'mixed') {
              const a = seeded(i) * 360, r = 10 + seeded(i + 7) * 60;
              return { x: CX + r * Math.cos(rad(a)), y: CY + r * Math.sin(rad(a)) };
            }
            const z = ZONES[zone], m = 14;
            const a = z.a0 + m + seeded(i + 3) * (z.a1 - z.a0 - 2 * m);
            const r = 30 + Math.sqrt(seeded(i + 11)) * (IN - 52);
            return { x: CX + r * Math.cos(rad(a)), y: CY + r * Math.sin(rad(a)) };
          }
          function expandTokens(items) {
            const out = { veg: [], prot: [], carb: [], mixed: [], side: [], drink: [] };
            items.forEach(it => {
              const f = food(it.id); if (!f) return;
              const z = catOf(f).z;
              const n = Math.min(Math.ceil(it.q), 4);
              for (let k = 0; k < n; k++) out[z].push({ e: f.e, id: it.id });
            });
            return out;
          }
          function plateSVG(items, t) {
            const tk = expandTokens(items);
            const fills = Object.entries(ZONES).map(([k, z]) => {
              const amt = k === 'veg' ? t.veg : k === 'prot' ? t.prot : t.carb;
              const op = 0.10 + clamp(amt / z.target, 0, 1) * 0.42;
              const over = k === 'carb' && t.carb > 1.5;
              return `<path class="zone-fill" d="${wedge(z.a0, z.a1, IN)}" fill="${over ? 'var(--bad)' : z.color}" opacity="${op}"/>`;
            }).join('');
            const labels = Object.values(ZONES).map(z => `<text class="zone-label" x="${z.lx}" y="${z.ly}" text-anchor="middle">${z.label}</text>`).join('');
            let idx = 0;
            const toks = ['veg', 'prot', 'carb', 'mixed'].flatMap(z => tk[z].map((o, i) => {
              const p = tokenPos(z, i + (z === 'mixed' ? 50 : 0));
              idx++;
              return `<text class="token" data-tok="${z}-${i}" x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="central">${o.e}</text>`;
            })).join('');
            return `<svg id="plateSvg" viewBox="0 0 300 300">
              <ellipse cx="152" cy="160" rx="146" ry="142" fill="rgba(0,0,0,.35)"/>
              <circle cx="${CX}" cy="${CY}" r="${RIM}" fill="var(--plate-rim)"/>
              <circle cx="${CX}" cy="${CY}" r="${RIM - 4}" fill="var(--plate)"/>
              <circle cx="${CX}" cy="${CY}" r="${IN}" fill="#f6f3e9" stroke="#d8d3c2" stroke-width="2"/>
              ${fills}
              <line x1="${CX}" y1="${CY - IN}" x2="${CX}" y2="${CY + IN}" stroke="#cdc7b4" stroke-width="2.5" stroke-dasharray="6 5"/>
              <line x1="${CX}" y1="${CY}" x2="${CX + IN}" y2="${CY}" stroke="#cdc7b4" stroke-width="2.5" stroke-dasharray="6 5"/>
              ${labels}
              <g id="tokens">${toks}</g>
            </svg>`;
          }
          function sidesSVG(items) {
            const tk = expandTokens(items);
            const bowl = tk.side.slice(0, 6).map((o, i) => `<text class="token" x="${22 + (i % 3) * 18}" y="${30 + Math.floor(i / 3) * 14}" text-anchor="middle" dominant-baseline="central" font-size="15">${o.e}</text>`).join('');
            const glassFill = tk.drink.length ? 1 : 0;
            const drink = tk.drink.slice(0, 1).map(o => `<text class="token" x="40" y="58" text-anchor="middle" dominant-baseline="central" font-size="22">${o.e}</text>`).join('');
            return `
            <svg class="side-svg" id="bowlSvg" viewBox="0 0 80 64"><ellipse cx="40" cy="58" rx="30" ry="5" fill="rgba(0,0,0,.35)"/>
              <path d="M6 22 Q40 70 74 22 Z" fill="#e9e6da" stroke="#cfcab8" stroke-width="2"/><ellipse cx="40" cy="22" rx="34" ry="8" fill="#f6f3e9" stroke="#cfcab8" stroke-width="2"/>${bowl}
              <text x="40" y="8" text-anchor="middle" font-size="8" fill="#d9cdb5" font-family="Inter" font-weight="600">EXTRAS</text></svg>
            <svg class="side-svg" id="glassSvg" viewBox="0 0 80 96"><text x="40" y="8" text-anchor="middle" font-size="8" fill="#d9cdb5" font-family="Inter" font-weight="600">VASO</text>
              <path d="M18 14 L62 14 L57 90 L23 90 Z" fill="rgba(255,255,255,.12)" stroke="#d9d2bf" stroke-width="2"/>
              ${glassFill ? '<path d="M20 40 L60 40 L57 90 L23 90 Z" fill="rgba(160,90,40,.55)"/>' : ''}${drink}</svg>`;
          }
          function verdict(mealId, items, t) {
            const T = targets();
            if (!items.length) return { cls: '', e: '🪖', m: 'Plato vacío. Elige abajo lo que vas a comer y míralo llegar al plato.' };
            const warned = items.map(it => food(it.id)).filter(f => f && f.warn);
            if (t.soda) return { cls: 'bad', e: '🚨', m: 'Bebida en la bandeja. Eso rompe la racha, soldado.' };
            if (mealId === 'cena' && t.carb > 0) return { cls: 'bad', e: '😤', m: 'Carbohidrato en la cena. ¡Fuera! De noche: proteína y verduras.' };
            if (warned.length) return { cls: 'bad', e: '⚠️', m: warned[warned.length - 1].warn };
            if (t.k > T.kcal * 0.45) return { cls: 'bad', e: '😠', m: `Este plato son ${fmt(t.k)} kcal, casi la mitad del día. Achícalo.` };
            if (t.carb > 1.5) return { cls: 'bad', e: '😤', m: 'Demasiado carbohidrato. Una porción y se acabó. El resto, verdura.' };
            const main = mealId === 'almuerzo' || mealId === 'cena';
            if (main && t.pr < 20) return { cls: '', e: '🍗', m: 'Falta proteína. Sin proteína vas a tener hambre en una hora.' };
            if (main && t.veg < 2) return { cls: '', e: '🥦', m: `Falta verde. La mitad del plato es verdura: lleva ${t.veg} de 2 porciones.` };
            if ((mealId === 'desayuno' || mealId === 'once') && t.pr < 12) return { cls: '', e: '🥚', m: 'Sin proteína esto no te sostiene. Agrega huevo, quesillo o yogur griego.' };
            if (mealId.startsWith('colacion') && t.k > 250) return { cls: '', e: '🫡', m: 'Colación muy grande. Una colación es un tentempié, no un almuerzo.' };
            return { cls: 'good', e: '🎖️', m: '¡PLATO APROBADO! Así se come en el cuartel.' };
          }
          function renderPlato() {
            if (!MEAL) MEAL = defaultMeal();
            const dd = day(), items = dd.meals[MEAL] || [], t = mealTotals(items), dt = dayTotals(), T = targets();
            const v = verdict(MEAL, items, t);
            $('#view').innerHTML = `
            <div class="meal-chips">${MEALS.map(m => { const k = mealTotals(dd.meals[m.id] || []).k; return `<button class="chip ${m.id === MEAL ? 'on' : ''}" data-act="meal" data-id="${m.id}">${m.e} ${m.n}${k ? `<span class="k">${fmt(k)}</span>` : ''}</button>`; }).join('')}</div>

            <div class="table-stage" id="stage">
              <div class="plate-wrap"><div id="plateHost" style="width:74%;max-width:290px;display:flex;justify-content:center">${plateSVG(items, t)}</div><div class="sides" id="sidesHost">${sidesSVG(items)}</div></div>
              <div class="legend"><span><i style="background:var(--veg)"></i>½ verduras</span><span><i style="background:var(--prot)"></i>¼ proteína</span><span><i style="background:var(--carb)"></i>¼ carbohidrato</span></div>
              <div class="kcal-hud"><div><div class="small" style="color:#d9cdb5">Este plato</div><span class="big" id="mealK">${fmt(t.k)}</span> <span class="small">kcal</span></div>
                <div style="text-align:right"><div class="small" style="color:#d9cdb5">Hoy</div><span class="num" style="font-weight:800;font-size:18px" id="dayK">${fmt(dt.k)}</span><span class="small"> / ${fmt(T.kcal)}</span></div></div>
              <div class="bar mt ${dt.k > T.kcal ? 'bad' : ''}"><i id="dayBar" style="width:${clamp(dt.k / T.kcal * 100, 0, 100)}%"></i></div>
              <div class="verdict ${v.cls}" id="verdict"><span>${v.e}</span><span>${esc(v.m)}</span></div>
            </div>

            <div class="card mt">
              <div class="cat-tabs">${CATS.map(c => `<button class="chip ${c.id === CAT && !QUERY ? 'on' : ''}" data-act="cat" data-id="${c.id}">${c.e} ${c.n}</button>`).join('')}</div>
              <input class="search" id="foodSearch" placeholder="🔎 Buscar alimento…" value="${esc(QUERY)}">
              <div class="foods" id="foodGrid">${foodGrid()}</div>
            </div>

            <div class="card" id="tableCard">${nutritionTable(items, t)}</div>
            <div class="card">${dayTable()}</div>
            `;
            $('#foodSearch').addEventListener('input', e => { QUERY = e.target.value.trim(); $('#foodGrid').innerHTML = foodGrid(); $$('.cat-tabs .chip').forEach(c => c.classList.toggle('on', !QUERY && c.dataset.id === CAT)); });
          }
          function foodGrid() {
            const q = QUERY.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
            let list = q ? allFoods().filter(f => f.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)) : allFoods().filter(f => f.cat === CAT || (CAT === 'mios' && f.custom));
            let html = list.map(f => `<button class="food ${f.warn ? 'warn' : ''}" data-act="add" data-id="${esc(f.id)}"><span class="em">${f.e}</span><span><div class="nm">${esc(f.n)}</div><div class="pt">${esc(f.p)}</div><div class="kc">${fmt(f.k)} kcal</div></span></button>`).join('');
            if (CAT === 'mios' && !q) html += `<button class="food" data-act="customOpen"><span class="em">➕</span><span><div class="nm">Agregar alimento</div><div class="pt">Con los datos de la etiqueta</div></span></button>`;
            if (!html) html = `<p class="muted small">No encontré "${esc(QUERY)}". Agrégalo en ⭐ Mis alimentos.</p>`;
            return html;
          }
          let LAST_ADDED = null;
          function nutritionTable(items, t) {
            const m = MEALS.find(x => x.id === MEAL);
            if (!items.length) return `<h3>📊 Tabla nutricional · ${m.n}</h3><p class="muted small mt">Todavía no agregas nada. Cada alimento que elijas aparece aquí con sus calorías y nutrientes.</p>`;
            return `<h3>📊 Tabla nutricional · ${m.n}</h3>
            <table class="ntable mt"><thead><tr><th>Alimento</th><th>Cant.</th><th>kcal</th><th>Prot</th><th>Carb</th><th>Grasa</th></tr></thead><tbody>
            ${items.map((it, i) => { const f = food(it.id); if (!f) return ''; return `<tr class="${it.id === LAST_ADDED ? 'new' : ''}"><td><div class="it"><span style="font-size:18px">${f.e}</span><div><div class="nm">${esc(f.n)}</div><div class="pt">${esc(f.p)}</div></div></div></td>
              <td><span class="qty"><button data-act="qty" data-i="${i}" data-d="-0.5">−</button><span class="num">${it.q}</span><button data-act="qty" data-i="${i}" data-d="0.5">+</button></span></td>
              <td>${fmt(f.k * it.q)}</td><td>${r0(f.pr * it.q)}</td><td>${r0(f.c * it.q)}</td><td>${r0(f.g * it.q)}</td></tr>`; }).join('')}
            <tr class="total"><td>TOTAL</td><td></td><td>${fmt(t.k)}</td><td>${r0(t.pr)}</td><td>${r0(t.c)}</td><td>${r0(t.g)}</td></tr>
            </tbody></table>
            <p class="small muted mt">Prot, carb y grasa en gramos. Cantidad en porciones (−/+ de a media). Valores aproximados.</p>`;
          }
          function dayTable() {
            const dd = day(), T = targets(), dt = dayTotals();
            const rows = MEALS.map(m => { const t = mealTotals(dd.meals[m.id] || []); return t.k ? `<tr><td>${m.e} ${m.n}</td><td>${fmt(t.k)}</td><td>${r0(t.pr)}</td><td>${r0(t.c)}</td><td>${r0(t.g)}</td></tr>` : ''; }).join('');
            const mbar = (lbl, v, tg, unit, cls = '') => `<div class="macro"><span>${lbl}</span><div class="bar ${v > tg * 1.05 ? 'bad' : cls}"><i style="width:${clamp(v / tg * 100, 0, 100)}%"></i></div><span class="v">${r0(v)}/${fmt(tg)} ${unit}</span></div>`;
            return `<h3>📅 Resumen del día</h3>
            ${rows ? `<table class="ntable mt"><thead><tr><th>Comida</th><th>kcal</th><th>Prot</th><th>Carb</th><th>Grasa</th></tr></thead><tbody>${rows}
            <tr class="total"><td>TOTAL</td><td>${fmt(dt.k)}</td><td>${r0(dt.pr)}</td><td>${r0(dt.c)}</td><td>${r0(dt.g)}</td></tr></tbody></table>` : '<p class="muted small mt">Sin comidas registradas hoy.</p>'}
            ${mbar('Calorías', dt.k, T.kcal, '')}
