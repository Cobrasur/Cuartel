          }

          // ================= ENTRENO =================
          const EX = {
            flex:    { n: 'Flexiones en escritorio', e: '🫸', sets: 2, reps: 8, w: false, alt: 'flexpared', how: ['Manos en el borde del escritorio, al ancho de hombros.', 'Cuerpo recto como tabla, sin sacar la guata.', 'Baja el pecho al borde en 2 segundos y empuja.'] },
