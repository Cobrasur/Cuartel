            <p class="small muted mt">Tu ración: ${fmt(T.kcal)} kcal diarias (gastas cerca de ${fmt(T.tdee)}). Se recalcula con cada pesaje.</p>`;
          }
          function animateNumber(el, from, to) {
            if (!el) return;
