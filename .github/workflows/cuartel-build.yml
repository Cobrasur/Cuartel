            remo:    { n: 'Remo con mancuerna', e: '🚣', sets: 2, reps: 10, w: true, kg: 6, perSide: true, alt: 'remo2', how: ['Una mano y una rodilla apoyadas en la silla, o la mano en el escritorio.', 'Espalda plana. Tira la mancuerna hacia la cadera.', 'Baja lento. Hazlo con cada brazo.'] },
            remo2:   { n: 'Remo sentado inclinado', e: '🪑', sets: 2, reps: 10, w: true, kg: 4, alt: 'remo', how: ['Sentado en la orilla de la silla, inclínate adelante con la espalda recta.', 'Una mancuerna en cada mano, brazos colgando.', 'Tira los codos hacia atrás y aprieta la espalda.'] },
            press:   { n: 'Press de hombros sentado', e: '🙌', sets: 2, reps: 10, w: true, kg: 4, alt: 'lateral', how: ['Sentado con la espalda apoyada.', 'Mancuernas a la altura de las orejas.', 'Empuja hacia arriba sin arquear la espalda y baja en 2 segundos.'] },
            lateral: { n: 'Elevaciones laterales', e: '🕊️', sets: 2, reps: 12, w: true, kg: 2, alt: 'press', how: ['De pie o sentado, mancuernas livianas a los lados.', 'Sube los brazos hasta la altura de los hombros, codos un poco doblados.', 'Baja lento. Peso liviano, sin impulso.'] },
